name: Build client (AppImage)

on:
  push:
    branches: [main, master]
    paths:
      - "client/**"
      - ".github/workflows/appimage_build.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x client/appimage/build-appimage.sh client/appimage/AppRun
          client/appimage/build-appimage.sh

      - name: Duman testi
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          f=client/appimage/dist/WFAS-Client-x86_64.AppImage
          "$f" --help >/tmp/help.txt 2>&1
          head -20 /tmp/help.txt
          "$f" --web-port 18091 --no-wifi-autoconnect >/tmp/run.log 2>&1 &
          pid=$!
          sleep 6
          curl -fsS localhost:18091/status.json
          kill "$pid" || true

      - uses: actions/upload-artifact@v4
        with:
          name: WFAS-Client-x86_64.AppImage
          path: client/appimage/dist/WFAS-Client-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # İki workflow (host + client) aynı release'i günceller; sıraya girsinler ki
    # release'i aynı anda oluşturmaya çalışıp çakışmasınlar.
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: WFAS-Client-x86_64.AppImage
          path: assets

      - name: Release etiketi
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            # Her main push'unda 'latest' etiketi son commit'e taşınır.
            git tag -f latest "$GITHUB_SHA"
            git push -f origin refs/tags/latest
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Son derleme (main)" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.pre }}
          body: "Otomatik derleme - commit ${{ github.sha }}"
          files: assets/*
