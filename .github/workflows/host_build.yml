name: Build host (Windows exe)

on:
  push:
    branches: [main, master]
    paths:
      - "host/**"
      - ".github/workflows/host_build.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/requirements-windows.txt

      - name: Bağımlılıklar
        run: python -m pip install -r requirements-windows.txt

      - name: Konsolsuz (tray-only) exe
        run: >
          python -m PyInstaller --onefile --windowed --name wfas_host
          --collect-data sv_ttk --hidden-import pystray._win32
          wfas_host.py

      - name: Konsollu (debug) exe
        run: >
          python -m PyInstaller --onefile --console --name wfas_host_debug
          --collect-data sv_ttk --hidden-import pystray._win32
          wfas_host.py

      - name: Paketle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\wfas_host.exe, dist\wfas_host_debug.exe, add_firewall_rules.bat release\
          Compress-Archive -Path dist\wfas_host.exe, dist\wfas_host_debug.exe, add_firewall_rules.bat, HOST_README.md -DestinationPath release\wfas-host-windows.zip -Force
          Get-FileHash release\* | Format-Table Hash, Path

      - uses: actions/upload-artifact@v4
        with:
          name: wfas-host-windows
          path: host/release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # İki workflow (host + client) aynı release'i günceller; sıraya girsinler ki
    # release'i aynı anda oluşturmaya çalışıp çakışmasınlar.
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wfas-host-windows
          path: assets

      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # v* etiketi: o sürüm için normal release
            TAG="$GITHUB_REF_NAME"
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          else
            # main push'u: 'latest' pre-release'inin dosyalarını güncelle.
            # Etiketi git ile taşımıyoruz: GITHUB_TOKEN, workflow dosyası içeren
            # bir commit'e etiket oluşturamaz/taşıyamaz. Bu yüzden 'latest'
            # release'i bir kez var olmalı; CI sadece dosyaların üstüne yazar.
            TAG=latest
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
                --title "Son derleme (main)" --notes "Otomatik derleme" || {
                echo "::error::'latest' release'i otomatik oluşturulamadı. Repo > Releases > Draft a new release: etiket 'latest', 'Set as a pre-release' işaretli, yayınla. Sonra bu çalışmayı yeniden başlat."
                exit 1
              }
            fi
            gh release edit "$TAG" --prerelease \
              --notes "Otomatik derleme - son commit $GITHUB_SHA ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          fi
          gh release upload "$TAG" assets/* --clobber
