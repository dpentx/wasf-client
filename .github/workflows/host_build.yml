name: Build host (Windows exe)

on:
  push:
    branches: [main, master]
    paths:
      - "host/**"
      - ".github/workflows/host_build.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/requirements-windows.txt

      - name: Bağımlılıklar
        run: python -m pip install -r requirements-windows.txt

      - name: Konsolsuz (tray-only) exe
        run: >
          python -m PyInstaller --onefile --windowed --name wfas_host
          --collect-data sv_ttk --hidden-import pystray._win32
          wfas_host.py

      - name: Konsollu (debug) exe
        run: >
          python -m PyInstaller --onefile --console --name wfas_host_debug
          --collect-data sv_ttk --hidden-import pystray._win32
          wfas_host.py

      - name: Paketle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\wfas_host.exe, dist\wfas_host_debug.exe, add_firewall_rules.bat release\
          Compress-Archive -Path dist\wfas_host.exe, dist\wfas_host_debug.exe, add_firewall_rules.bat, HOST_README.md -DestinationPath release\wfas-host-windows.zip -Force
          Get-FileHash release\* | Format-Table Hash, Path

      - uses: actions/upload-artifact@v4
        with:
          name: wfas-host-windows
          path: host/release/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # İki workflow (host + client) aynı release'i günceller; sıraya girsinler ki
    # release'i aynı anda oluşturmaya çalışıp çakışmasınlar.
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wfas-host-windows
          path: assets

      - name: Release etiketi
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            # Her main push'unda 'latest' etiketi son commit'e taşınır.
            git tag -f latest "$GITHUB_SHA"
            git push -f origin refs/tags/latest
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Son derleme (main)" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.pre }}
          body: "Otomatik derleme - commit ${{ github.sha }}"
          files: assets/*
