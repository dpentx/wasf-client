name: Build host (Windows exe)

on:
  push:
    branches: [main, master]
    paths:
      - "host/**"
      - ".github/workflows/build-host.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # tag push'ta release'e dosya yüklemek için

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: host/requirements-windows.txt

      - name: Bağımlılıklar
        run: python -m pip install -r requirements-windows.txt

      - name: Konsolsuz (tray-only) exe
        run: >
          python -m PyInstaller --onefile --windowed --name wfas_host
          --collect-data sv_ttk --hidden-import pystray._win32
          wfas_host.py

      - name: Konsollu (debug) exe
        run: >
          python -m PyInstaller --onefile --console --name wfas_host_debug
          --collect-data sv_ttk --hidden-import pystray._win32
          wfas_host.py

      - name: Paketle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist\wfas_host.exe, dist\wfas_host_debug.exe, add_firewall_rules.bat, HOST_README.md out\
          Compress-Archive -Path out\* -DestinationPath wfas-host-windows.zip -Force
          Get-FileHash dist\wfas_host.exe, dist\wfas_host_debug.exe | Format-Table Hash, Path

      - uses: actions/upload-artifact@v4
        with:
          name: wfas-host-windows
          path: |
            host/dist/wfas_host.exe
            host/dist/wfas_host_debug.exe
            host/add_firewall_rules.bat
            host/wfas-host-windows.zip
          if-no-files-found: error

      - name: Release'e ekle (sadece v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            host/dist/wfas_host.exe
            host/dist/wfas_host_debug.exe
            host/wfas-host-windows.zip
