name: Build client (AppImage)

on:
  push:
    branches: [main, master]
    paths:
      - "client/**"
      - ".github/workflows/appimage_build.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x client/appimage/build-appimage.sh client/appimage/AppRun
          client/appimage/build-appimage.sh

      - name: Duman testi
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          f=client/appimage/dist/WFAS-Client-x86_64.AppImage
          "$f" --help >/tmp/help.txt 2>&1
          head -20 /tmp/help.txt
          "$f" --web-port 18091 --no-wifi-autoconnect >/tmp/run.log 2>&1 &
          pid=$!
          sleep 6
          curl -fsS localhost:18091/status.json
          kill "$pid" || true

      - uses: actions/upload-artifact@v4
        with:
          name: WFAS-Client-x86_64.AppImage
          path: client/appimage/dist/WFAS-Client-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # İki workflow (host + client) aynı release'i günceller; sıraya girsinler ki
    # release'i aynı anda oluşturmaya çalışıp çakışmasınlar.
    concurrency:
      group: release-${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WFAS-Client-x86_64.AppImage
          path: assets

      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # v* etiketi: o sürüm için normal release
            TAG="$GITHUB_REF_NAME"
            gh release view "$TAG" >/dev/null 2>&1 || \
              gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          else
            # main push'u: 'latest' pre-release'inin dosyalarını güncelle.
            # Etiketi git ile taşımıyoruz: GITHUB_TOKEN, workflow dosyası içeren
            # bir commit'e etiket oluşturamaz/taşıyamaz. Bu yüzden 'latest'
            # release'i bir kez var olmalı; CI sadece dosyaların üstüne yazar.
            TAG=latest
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
                --title "Son derleme (main)" --notes "Otomatik derleme" || {
                echo "::error::'latest' release'i otomatik oluşturulamadı. Repo > Releases > Draft a new release: etiket 'latest', 'Set as a pre-release' işaretli, yayınla. Sonra bu çalışmayı yeniden başlat."
                exit 1
              }
            fi
            gh release edit "$TAG" --prerelease \
              --notes "Otomatik derleme - son commit $GITHUB_SHA ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          fi
          gh release upload "$TAG" assets/* --clobber
